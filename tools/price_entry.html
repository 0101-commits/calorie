<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가격 입력 — 프로틴레이더</title>
<style>
  :root{
    --bg:#f8fafc; --surface:#fff; --surface-2:#f1f5f9; --ink:#0f172a; --ink-2:#334155;
    --ink-3:#64748b; --line:#e2e8f0; --brand:#ea580c; --good:#059669; --r2:8px; --r3:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0b1220;--surface:#131b2b;--surface-2:#1b2537;--ink:#f1f5f9;--ink-2:#cbd5e1;--ink-3:#94a3b8;--line:#263248;--brand:#fb923c;--good:#34d399}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:0 0 96px}
  header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px}
  h1{margin:0 0 4px;font-size:18px}
  .sub{font-size:13px;color:var(--ink-3)}
  .bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .bar input[type=search]{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);
    border-radius:var(--r2);background:var(--surface-2);color:var(--ink);font-size:16px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:var(--r2);padding:10px 14px;min-height:44px}
  button.primary{background:var(--brand);color:#fff;border-color:transparent;font-weight:700}
  .chip{padding:8px 12px;border-radius:999px;font-size:13px;min-height:40px}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  main{padding:12px 16px;display:grid;gap:10px;max-width:760px;margin:0 auto}
  .row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
    padding:12px;display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center}
  .row.done{border-color:var(--good)}
  .name{font-weight:700;line-height:1.35}
  .meta{font-size:12px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:4px;
    background:var(--surface-2);color:var(--ink-2);margin-right:4px}
  input[type=number]{width:100%;padding:12px;border:1px solid var(--line);border-radius:var(--r2);
    background:var(--surface-2);color:var(--ink);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=number]:focus{outline:2px solid var(--brand);outline-offset:1px}
  .foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
  .status{font-size:13px;color:var(--ink-2)}
  .empty{text-align:center;color:var(--ink-3);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>가격 입력</h1>
  <div class="sub">
    공공DB에 영양은 있는데 가격이 없는 편의점 PB 상품입니다.
    앱·매장에서 <b>눈으로 확인한 정가</b>만 입력하세요. 모르면 비워 두면 됩니다.
  </div>
  <div class="bar">
    <input type="search" id="q" placeholder="상품명 검색">
    <button class="chip on" data-filter="all" type="button">전체</button>
    <button class="chip" data-filter="todo" type="button">미입력</button>
    <button class="chip" data-filter="GS25" type="button">GS25</button>
    <button class="chip" data-filter="CU" type="button">CU</button>
    <button class="chip" data-filter="세븐일레븐" type="button">세븐</button>
    <button class="chip" data-filter="이마트24" type="button">이마트24</button>
  </div>
</header>

<main id="list"></main>

<div class="foot">
  <span class="status" id="status">불러오는 중…</span>
  <button class="primary" id="save" type="button">저장</button>
</div>

<script>
let items = [];
let filter = 'all';
let query = '';

const $ = s => document.querySelector(s);

async function load() {
  const res = await fetch('/api/pending');
  items = await res.json();
  render();
}

function visible() {
  return items.filter(it => {
    if (filter === 'todo' && it.price_krw) return false;
    if (filter !== 'all' && filter !== 'todo' && it.chain !== filter) return false;
    if (query && !it.name.toLowerCase().includes(query)) return false;
    return true;
  });
}

function render() {
  const list = $('#list');
  const rows = visible();
  if (!rows.length) {
    list.innerHTML = '<div class="empty">해당하는 상품이 없습니다.</div>';
  } else {
    list.innerHTML = rows.map(it => `
      <div class="row ${it.price_krw ? 'done' : ''}" data-id="${it.menu_id}">
        <div>
          <div class="name">${it.name}</div>
          <div class="meta">
            <span class="tag">${it.chain}</span>
            <span class="tag">${it.category}</span>
            ${it.marketing_claim ? '<span class="tag">단백질 표기</span>' : ''}
            ${it.serving_g}g · ${it.kcal}kcal · 단백질 ${it.protein_g}g · 나트륨 ${it.sodium_mg ?? '—'}mg
          </div>
        </div>
        <input type="number" inputmode="numeric" min="300" max="30000" step="50"
               placeholder="원" value="${it.price_krw ?? ''}" aria-label="${it.name} 가격">
      </div>`).join('');
  }
  updateStatus();
}

function updateStatus() {
  const done = items.filter(x => x.price_krw).length;
  $('#status').textContent = `${items.length}건 중 ${done}건 입력됨 · 화면에 ${visible().length}건`;
}

document.addEventListener('input', e => {
  if (e.target.matches('input[type=number]')) {
    const id = e.target.closest('.row').dataset.id;
    const it = items.find(x => x.menu_id === id);
    const v = Number(e.target.value);
    it.price_krw = Number.isFinite(v) && v >= 300 ? v : null;
    it.price_krw_status = it.price_krw ? 'measured' : 'unknown';
    e.target.closest('.row').classList.toggle('done', Boolean(it.price_krw));
    updateStatus();
  }
  if (e.target.id === 'q') { query = e.target.value.trim().toLowerCase(); render(); }
});

document.addEventListener('click', e => {
  if (e.target.matches('[data-filter]')) {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('on', b === e.target));
    filter = e.target.dataset.filter;
    render();
  }
});

$('#save').addEventListener('click', async () => {
  $('#save').disabled = true;
  $('#status').textContent = '저장 중…';
  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(items)
    });
    const r = await res.json();
    $('#status').textContent = `저장됨 · 가격 입력 ${r.priced}건`;
  } catch (err) {
    $('#status').textContent = '저장 실패: ' + err.message;
  } finally {
    $('#save').disabled = false;
  }
});

load();
</script>
</body>
</html>
